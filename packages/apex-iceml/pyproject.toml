[project]
name = "apex-iceml"
version = "0.1.0"
description = "APEX ICEML — Industrial & Commercial Equipment canonical entities over SAE J1939 + AEMP 2.0 + ISO 14224."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "apex-standards-j1939",
    "apex-standards-iso14224",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_iceml"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
apex-standards-j1939 = { workspace = true }
apex-standards-iso14224 = { workspace = true }
