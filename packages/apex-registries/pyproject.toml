[project]
name = "apex-registries"
version = "0.1.0"
description = "APEX Master Registries — KPI, Persona, MCP-tool, Schema, Archetype, Product, Partner, Competitive, Exercise, Playbook, Discovery, Pre-clearance. Sprint 19, Appendices A-K."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "apex-agents>=0.1.0",
    "apex-services>=0.1.0",
    "apex-references>=0.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_registries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Registry conformance tests",
]
