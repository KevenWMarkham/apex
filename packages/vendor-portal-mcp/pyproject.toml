[project]
name = "vendor-portal-mcp"
version = "0.1.0"
description = "APEX vendor-portal-mcp — vendor-portal API aggregation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
vendor-portal-mcp = "vendor_portal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_portal_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
mcp-common = { workspace = true }
