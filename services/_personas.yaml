# services/_personas.yaml
#
# Framework-level persona registry. Use cases reference personas BY ID.
# Adding a persona: append here once; every use case across every service
# can reference it. Removing: deprecate via `deprecated_at: <date>` field;
# do not delete.
#
# RC-only personas first. HLS / ER / AXLE / TH / TMT / ICE personas land
# when those practices come online (per Sprint Plan §58+).

# ===== RC practice =====

marisol-reyes-store-ops:
  label: Marisol Reyes
  role: Store Operations Lead
  level: store
  org: store-operations
  hitl_authority:
    - markdown_decisions
    - destroy_decisions
    - refund_above_threshold
  default_kpis:
    - shrink-cost-reduction-pct
    - decision-loop-time-sec
  used_by_services:
    - RC-E2E-03
  notes: >-
    Approves cold-chain excursion sell-through / markdown / destroy
    decisions via Microsoft Teams Adaptive Card. Decision writes to
    audit row with operator-OBO trace. See Services Guide §18.1.

