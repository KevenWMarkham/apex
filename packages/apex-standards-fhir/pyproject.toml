[project]
name = "apex-standards-fhir"
version = "0.1.0"
description = "APEX HL7 FHIR R4 Pattern-B mirror — typed Pydantic models for the FHIR resource subset APEX HLS agents consume."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. FHIR content license: HL7 FHIR (royalty-free, see LICENSE-ATTRIBUTION.md)." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_fhir"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
