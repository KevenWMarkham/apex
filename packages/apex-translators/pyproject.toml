[project]
name = "apex-translators"
version = "0.1.0"
description = "APEX message-format translators — Sprint 23. EDI X12, HL7 v2, HL7 CDA, EPCIS 2.0, OAGIS BOD, IATA PADIS bidirectional parsers/emitters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "pydantic>=2.9.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_translators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Translator conformance tests",
]
