[project]
name = "merml-mcp"
version = "0.1.0"
description = "APEX merml-mcp — Merchandising canonical reads (Price / Promotion / Markdown)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core", "apex-merml", "fabric-mcp", "mcp-common", "pydantic>=2.9.0",
]

[project.scripts]
merml-mcp = "merml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merml_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-merml = { workspace = true }
fabric-mcp = { workspace = true }
mcp-common = { workspace = true }
