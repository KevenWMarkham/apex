  - tool_id: apex.rc.mcp.scml.get_substitute_table
    purpose: Read approved substitution adjacencies
  - tool_id: apex.rc.mcp.cxml.get_customer_profile
    purpose: Read shopper preferences if loyalty-linked

oversight_modes: [HOTL]

kpis:
  - name: stockout-saved revenue
    direction: money
    target_band: "+$2-5M/yr per chain"
