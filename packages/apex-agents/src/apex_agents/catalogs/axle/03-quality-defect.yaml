kind: agent
name: apex.axle.agents.quality-defect
version: 0.1.0
practice: axle
persona: Quality Engineer
service_codes: [AXLE-QMS-01]
model_tier: standard
model_pin: gpt-4o-2024-11-20
prompt_sha: ""
description: >
  Detect quality defects via vision-system signals + CMM measurements +
  inline-test outputs. Classifies severity and routes to disposition.
archetype_id: F2-event-cluster-pattern-match
primary_contact: axle-practice-lead@deloitte.com

tools:
  - tool_id: apex.axle.mcp.qmsml.get_inspection_results
    purpose: Read CMM + vision inspection
  - tool_id: apex.axle.mcp.qmsml.classify_defect
    purpose: Classify defect severity
  - tool_id: apex.axle.mcp.qmsml.create_ncr
    purpose: Create non-conformance report
    write: true

hitl_gates:
  - name: ncr_creation
    description: NCR creation requires QE acknowledgment
    fires_when: Defect classified severe
    surface: teams_card
    sla_minutes: 60

oversight_modes: [HITL, HOTL]
kpis:
  - { name: first-pass yield, direction: up }
  - { name: PPM defect rate, direction: down }
