target-version = "py311"
line-length = 100
extend-exclude = [
    "node_modules",
    ".venv",
    "archive",
    "notebooks",
    # CI lints packages/ and tools/ (plus the root conftest.py). The trees
    # below hold one-off generator scripts, doc-embedded code and app/
    # infra prototypes that are not held to the package lint bar.
    "scripts",
    "docs",
    "apex-a",
    "apex-g",
    "apex-m",
    "apex-workspace",
    "apps",
    "services",
    "apex.py",
    "build-solution-stack.py",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle (Google conventions)
]
ignore = [
    "E501",  # line length — handled by formatter
    "D100",  # missing module docstring (allowed at package level)
    "D104",  # missing package docstring in __init__
    "D203",  # 1 blank line before class docstring (conflicts with D211)
    "D213",  # multi-line docstring summary should start on second line (conflicts with D212)
]

# Deliberate typographic characters used in labels and docs: EN DASH,
# MINUS SIGN and MULTIPLICATION SIGN.
allowed-confusables = ["–", "−", "×"]

[lint.flake8-bugbear]
# Typer declares CLI parameters via default-value calls; they are evaluated
# once by design and never mutated.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]
"**/conftest.py" = ["D"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
