[project]
name = "apex-standards-cim"
version = "0.1.0"
description = "APEX IEC 61970 + IEC 61968 CIM Pattern-B mirror — utility power-system model + utility operations (consumed by ER)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. CIM / IEC 61970 / IEC 61968 are IEC-copyrighted; this package ships structural mirrors only." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_cim"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
