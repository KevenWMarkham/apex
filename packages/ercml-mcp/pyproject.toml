[project]
name = "ercml-mcp"
version = "0.1.0"
description = "APEX ercml-mcp — Energy & Resources canonical reads (Meter / Reading / GridEvent)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core", "apex-ercml", "fabric-mcp", "mcp-common", "pydantic>=2.9.0",
]

[project.scripts]
ercml-mcp = "ercml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ercml_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-ercml = { workspace = true }
fabric-mcp = { workspace = true }
mcp-common = { workspace = true }
