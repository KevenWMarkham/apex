# services/rc/_build-status.yaml
#
# Source of truth for the RC (Retail & Consumer) build plan.
# - The deploy-wizard reads this via GET /api/catalog/build-status
# - The Roadmap page renders the sprint table from this file
# - The TreeView decorates services / scenarios / agents with the status here
# - The Roadmap docs at docs/APEX - Design and Build/RC-Build-Plan.md
#   reference this file as the authoritative "% done" view
#
# Status vocabulary (kept consistent across services / scenarios / agents):
#   planned       — designed, scoped, not started
#   scaffolded    — folder + yaml + Bicep stub generated (this repo)
#   implemented   — agent prompts / tools / Bicep wired and unit-tested
#   deployed      — successfully deployed to at least Lab tenant
#   pilot         — running with real data behind HITL
#   ga            — generally available (Wave 3)
#
# Sprint convention: continues the framework-wide Roadmap.md sprint cadence.
# RC-specific sprints start at Sprint 30 (Sprints 1–29 covered framework
# foundation; see Roadmap.md §1).

practice: rc
practice_label: Retail & Consumer Products
services_guide_ref: docs/book/Professional-APEX-M-Services-Guide.html#ch-18
roadmap_ref: docs/APEX - Design and Build/Roadmap.md
retirement_map_ref: docs/APEX - Design and Build/Sprint-Backlog-Retirement-Map.md
plan_version: 2
plan_owner: Keven Markham · DMTSP

# Each sprint declares `retires:` — the canonical BL.P.* / DEP-NNN IDs it
# retires. Wizard surfaces these as badges on the Roadmap page; the Sprint
# Backlog Retirement Map doc validates the claim end-to-end.
# Status meaning per item:
#   partial    — sprint advances the item but full retirement requires later sprints
#   completion — sprint finishes the item; the previous partials all flip to done
#   production — sprint promotes a previously-mock impl to production wiring
#   (item already counted as done in Roadmap.md v1.2 — kept here for posture audit)

# ---------------------------------------------------------------------------
# Sprint orchestration — checklist surfaced in the wizard's Roadmap page.
# `done: true` flips the checkbox; the wizard sums these into a per-sprint
# progress bar. Each item links back to the relevant Roadmap.md BL.* IDs and
# the Services Guide section.
# ---------------------------------------------------------------------------
