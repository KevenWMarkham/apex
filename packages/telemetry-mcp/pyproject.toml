[project]
name = "telemetry-mcp"
version = "0.1.0"
description = "APEX telemetry-mcp — trace emission, event logging, latency percentile queries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
telemetry-mcp = "telemetry_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
mcp-common = { workspace = true }
