[project]
name = "apex-schemas-common"
version = "0.1.0"
description = "Shared infrastructure for APEX canonical schemas: entity base, SCD2, DDL generator, Purview payload emitter, standards registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
url-validation = ["pydantic[email]>=2.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_schemas_common"]

[tool.uv.sources]
apex-core = { workspace = true }
