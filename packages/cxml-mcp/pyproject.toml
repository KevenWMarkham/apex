[project]
name = "cxml-mcp"
version = "0.1.0"
description = "APEX cxml-mcp — Customer canonical reads (Customer / Order / Interaction)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core", "apex-cxml", "fabric-mcp", "mcp-common", "pydantic>=2.9.0",
]

[project.scripts]
cxml-mcp = "cxml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxml_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-cxml = { workspace = true }
fabric-mcp = { workspace = true }
mcp-common = { workspace = true }
