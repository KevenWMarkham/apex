  attribution_path: WOSFML.TaskAssignment → g_kpi_rc_e2e_05_daily
  default_persona: jamie-oconnor-store-manager
  used_by_services:
    - RC-E2E-05

# ===== RC-E2E-07 Returns Fraud =====

fraud-detection-rate-pct:
  label: Fraud detection rate lift
  unit: pct
  description: Increase in detected returns-fraud incidents vs baseline rules
  formula_ref: g_kpi_rc_e2e_07_daily.fraud_detection_rate_pct
  attribution_path: SCML.Return → g_fraud_pattern_attribution
  default_persona: rebecca-hall-returns-ops-mgr
  used_by_services:
    - RC-E2E-07

recovered-loss-usd:
  label: Recovered loss
  unit: usd
  description: Dollar value of fraud loss prevented (Year 1)
  formula_ref: g_kpi_rc_e2e_07_daily.recovered_loss_usd
  attribution_path: g_return_event_panel → audit row → g_fraud_pattern_attribution
  default_persona: rebecca-hall-returns-ops-mgr
  used_by_services:
    - RC-E2E-07

false-positive-rate-pct:
  label: False positive rate
  unit: pct
  description: Fraud-flagged events that are legitimate
  formula_ref: g_kpi_rc_e2e_07_daily.fp_rate_pct
  attribution_path: g_return_event_panel → operator decision → g_fraud_pattern_attribution
  default_persona: rebecca-hall-returns-ops-mgr
  used_by_services:
    - RC-E2E-07

# ===== RC-E2E-09 Product Tracking (FSMA 204) =====

recall-traceability-time-hr:
  label: Recall traceability time
  unit: hr
  description: Time to produce full lot-provenance trace for a recall event
  formula_ref: g_kpi_rc_e2e_09_daily.recall_trace_time_hr
  attribution_path: SCML.Lot → SCML.Movement → g_recall_traceability_panel
  default_persona: compliance-officer-fsma-204
  used_by_services:
    - RC-E2E-09

fsma-compliance-score:
  label: FSMA 204 compliance score
  unit: pct
  description: Percentage of high-risk lots with full chain-of-custody available
  formula_ref: g_kpi_rc_e2e_09_daily.fsma_compliance_pct
  attribution_path: SCML.Lot → ECRML.AuditTrail → g_fsma_compliance_attribution
  default_persona: compliance-officer-fsma-204
  used_by_services:
    - RC-E2E-09
