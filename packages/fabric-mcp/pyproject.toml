[project]
name = "fabric-mcp"
version = "0.1.0"
description = "APEX fabric-mcp — Gold / OneLake read tools for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "mcp-common",
    "pydantic>=2.9.0",
]

[project.scripts]
fabric-mcp = "fabric_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
mcp-common = { workspace = true }
