[project]
name = "apex-m"
version = "0.1.0"
description = "APEX-M — Microsoft variant. Implements APEX-Core protocols against Azure / M365 / Power Platform / Microsoft Foundry / Microsoft Fabric / Microsoft Purview / Microsoft Defender / Microsoft Entra."
requires-python = ">=3.12"
authors = [{ name = "Deloitte's Microsoft Technology & Services Practice" }]
license = "Proprietary"
dependencies = [
    "apex-core",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-cosmos>=4.7",
    "azure-monitor-opentelemetry>=1.6",
    "azure-mgmt-cognitiveservices>=14.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
