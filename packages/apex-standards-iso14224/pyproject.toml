[project]
name = "apex-standards-iso14224"
version = "0.1.0"
description = "APEX ISO 14224 Pattern-B mirror — reliability and maintenance data taxonomy (shared by AXLE, ICE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_iso14224"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
