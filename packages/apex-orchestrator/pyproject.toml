[project]
name = "apex-orchestrator"
version = "0.2.0"
description = "APEX orchestration runtime — primitives, 47-archetype library, 4×4 gate kinds/variants, pausable execution, tenant policy tuning, Sprint 26 Redis control plane + HEARTBEAT scheduler + MCP cache-aware dispatcher."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "mcp-common",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_orchestrator"]

[tool.uv.sources]
apex-core = { workspace = true }
mcp-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Sprint 26 conformance tests",
]
