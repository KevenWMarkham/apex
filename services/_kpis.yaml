  formula_ref: g_kpi_rc_e2e_05_daily.sales_per_sqft_pct
  attribution_path: MERML.Transaction → g_kpi_rc_e2e_05_daily
  default_persona: jamie-oconnor-store-manager
  used_by_services:
    - RC-E2E-05

associate-productivity-pct:
