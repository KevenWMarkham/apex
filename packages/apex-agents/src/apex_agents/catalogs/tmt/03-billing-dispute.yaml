kind: agent
name: apex.tmt.agents.billing-dispute
version: 0.1.0
practice: tmt
persona: Billing Operations Lead
service_codes: [TMT-TEL-03]
model_tier: standard
model_pin: gpt-4o-2024-11-20
prompt_sha: ""
description: >
  Billing-dispute classification across high-volume CSR queues. Routes disputes to auto-resolve / examiner / escalate lanes.
archetype_id: F2-event-cluster-pattern-match
primary_contact: tmt-practice-lead@deloitte.com

tools:
  - tool_id: apex.tmt.mcp.bssml.get_dispute_request
    purpose: Read inbound dispute
  - tool_id: apex.tmt.mcp.bssml.get_billing_history
    purpose: Read 12-month billing history
  - tool_id: apex.tmt.mcp.bssml.post_resolution
    purpose: Post resolution decision
    write: true

hitl_gates:
  - name: examiner_review
    description: Disputes claiming > $500 require examiner review
    fires_when: Disputed amount > $500
    surface: dashboard
    sla_minutes: 1440

oversight_modes: [HITL]

kpis:
  - { name: dispute cycle time, direction: down }
