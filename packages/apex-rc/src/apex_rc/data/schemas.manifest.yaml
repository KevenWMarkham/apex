kind: schema
name: rc-practice-schemas
version: 0.2.0      # Sprint 30.3 + 30.4 — added Inventory / Elasticity / Competitor / PROML
owner: rc-practice-lead
practice: rc
description: RC Practice schema bundle — SCML + MERML + CXML + PROML declarative manifest.
family: rc

# Every canonical entity across the three RC schema families.
entities:
  # --- SCML (Supply Chain) -----------------------------------------------
  - name: sku
    natural_key: [sku_natural]
    classification: internal
    attributes:
      - name: sku_natural
        data_type: string
        nullable: false
      - name: gtin
        data_type: string
        nullable: true
        description: GS1 GTIN-14.
      - name: sku_status
        data_type: string
        nullable: false
        enum: [ACTIVE, INACTIVE, DISCONTINUED]
      - name: unit_cost_token
        data_type: string
        nullable: true
        classification: trade_secret

  - name: location
    natural_key: [location_natural]
    classification: internal
    attributes:
      - name: location_natural
        data_type: string
        nullable: false
      - name: gln
        data_type: string
        nullable: true
      - name: location_type
        data_type: string
        nullable: false
        enum: [STORE, DC, WAREHOUSE, SUPPLIER_SITE, CROSS_DOCK]

  - name: lot
    natural_key: [lot_number]
    classification: internal
    attributes:
      - name: lot_number
        data_type: string
        nullable: false
      - name: sku_key
        data_type: string
        nullable: false

  - name: shipment
    natural_key: [shipment_natural]
    classification: internal
    attributes:
      - name: shipment_natural
        data_type: string
        nullable: false
      - name: sscc
        data_type: string
        nullable: true

  - name: supplier
    natural_key: [supplier_natural]
    classification: internal
    attributes:
      - name: supplier_natural
        data_type: string
        nullable: false
      - name: contact_email_token
        data_type: string
        nullable: true
        classification: pii

  - name: item
    natural_key: [item_natural]
    classification: internal
    attributes:
      - name: item_natural
        data_type: string
        nullable: false

  - name: inventory
    natural_key: [sku_key, location_key, snapshot_at]
    classification: internal
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: location_key
        data_type: string
        nullable: false
      - name: snapshot_kind
        data_type: string
        nullable: false
        enum: [PERPETUAL, PHYSICAL, CYCLE_COUNT, RECEIPT, SHIPMENT]
      - name: on_hand_qty
        data_type: decimal
        nullable: false
      - name: avg_daily_demand
        data_type: decimal
        nullable: true

  # --- MERML (Merchandising) ---------------------------------------------
  - name: category
    natural_key: [category_natural]
    classification: internal
    attributes:
      - name: category_natural
        data_type: string
        nullable: false
      - name: category_name
        data_type: string
        nullable: false

  - name: price
    natural_key: [sku_key, kind, effective_from]
    classification: internal
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: amount
        data_type: decimal
        nullable: false

  - name: promotion
    natural_key: [promotion_natural]
    classification: internal
    attributes:
      - name: promotion_natural
        data_type: string
        nullable: false
      - name: promotion_type
        data_type: string
        nullable: false

  - name: markdown
    natural_key: [sku_key, applied_at]
    classification: internal
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: reason
        data_type: string
        nullable: false
        enum: [SEASONAL, OVERSTOCK, DAMAGED, EXPIRATION, COMPETITIVE, CLEARANCE]

  - name: elasticity
    natural_key: [sku_key, location_key, fit_at]
    classification: trade_secret
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: location_key
        data_type: string
        nullable: true
      - name: model_kind
        data_type: string
        nullable: false
        enum: [LOG_LOG, SEMI_LOG, PIECEWISE, BAYESIAN]
      - name: coefficient
        data_type: decimal
        nullable: false
        classification: trade_secret

  - name: competitor
    natural_key: [sku_key, competitor_name, observed_at]
    classification: internal
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: competitor_name
        data_type: string
        nullable: false
      - name: match_kind
        data_type: string
        nullable: false
        enum: [GTIN, MPN, HEURISTIC, MANUAL]
      - name: list_price
        data_type: decimal
        nullable: false
      - name: promo_price
        data_type: decimal
        nullable: true

  # --- PROML (Pricing) — Sprint 30.4 -------------------------------------
  - name: pricing
    natural_key: [sku_key, location_key, effective_from]
    classification: trade_secret
    attributes:
      - name: sku_key
        data_type: string
        nullable: false
      - name: location_key
        data_type: string
        nullable: true
      - name: list_price
        data_type: decimal
        nullable: false
      - name: floor_price
        data_type: decimal
        nullable: true
        classification: trade_secret
      - name: map_price
        data_type: decimal
        nullable: true
        classification: trade_secret

  - name: discount_rule
    natural_key: [rule_natural]
    classification: trade_secret
    attributes:
      - name: rule_natural
        data_type: string
        nullable: false
      - name: rule_kind
        data_type: string
        nullable: false
        enum: [BUYER_LADDER, SEASONAL, CLEARANCE, MARGIN_FLOOR, COMPETITOR_MATCH]
      - name: cap_pct
        data_type: decimal
        nullable: true
        classification: trade_secret

  # --- CXML (Customer) ---------------------------------------------------
  - name: customer
    natural_key: [customer_natural]
    classification: pii
    attributes:
      - name: customer_natural
        data_type: string
        nullable: false
      - name: email_token
        data_type: string
        nullable: true
        classification: pii
      - name: phone_token
        data_type: string
        nullable: true
        classification: pii

  - name: loyalty
    natural_key: [customer_key, program_code]
    classification: member_only
    attributes:
      - name: customer_key
        data_type: string
        nullable: false
      - name: member_number_token
        data_type: string
        nullable: false
        classification: member_only

  - name: interaction
    natural_key: [event_id]
    classification: internal
    attributes:
      - name: channel
        data_type: string
        nullable: false
        enum: [IN_STORE, WEB, MOBILE, EMAIL, SMS, PHONE, CHAT]

  - name: order
    natural_key: [order_natural]
    classification: pci
    attributes:
      - name: order_natural
        data_type: string
        nullable: false
      - name: payment_method_token
        data_type: string
        nullable: true
        classification: pci

standards:
  - GS1 GTIN (RC anchor identifier)
  - GS1 SSCC
  - GS1 GLN
  - EPCIS 2.0
  - Schema.org Product/Offer
