[project]
name = "approvals-mcp"
version = "0.1.0"
description = "APEX approvals-mcp — HITL approval workflow (request / status / record)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
approvals-mcp = "approvals_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approvals_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
mcp-common = { workspace = true }
