[project]
name = "apex-standards-opentravel"
version = "0.1.0"
description = "APEX OpenTravel Alliance (OTA) Pattern-B mirror — Air / Hotel / Car subsets consumed by TH."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. OTA schemas are openly published." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_opentravel"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
