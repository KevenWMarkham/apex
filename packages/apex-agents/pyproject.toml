[project]
name = "apex-agents"
version = "0.1.0"
description = "APEX Agent Catalog — Practice-specific agent manifests with personas, KPIs, MCP tool allow-lists, and HITL gates. Sprint 16."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Agent catalog conformance tests",
]
