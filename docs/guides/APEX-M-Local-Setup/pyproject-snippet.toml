# =====================================================================
# Original dependency declaration from apex-m/pyproject.toml
# =====================================================================
# Reproduced here so uv-based installers can copy/paste into a fresh
# pyproject.toml when extracting APEX-M as a standalone project.
# Authoritative copy lives at apex-m/pyproject.toml in the APEX repo.
# =====================================================================

[project]
name = "apex-m"
version = "0.1.0"
description = "APEX-M — Microsoft variant. Implements APEX-Core protocols against Azure / M365 / Power Platform / Microsoft Foundry / Microsoft Fabric / Microsoft Purview / Microsoft Defender / Microsoft Entra."
requires-python = ">=3.12"
authors = [{ name = "Deloitte's Microsoft Technology & Services Practice" }]
license = "Proprietary"
dependencies = [
    "apex-core",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-cosmos>=4.7",
    "azure-monitor-opentelemetry>=1.6",
    "azure-mgmt-cognitiveservices>=14.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Sprint 41+ — production-runtime SDKs. Lazy-imported by apex_m.* impls;
# install only when running against a real Microsoft tenant. Mock impls
# work without these.
runtime = [
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-cosmos>=4.7",
    "azure-monitor-opentelemetry>=1.6",
    "azure-mgmt-cognitiveservices>=14.0",
    "azure-ai-projects>=1.0.0b3",
    "msal>=1.31",
    "httpx>=0.27",
    # Microsoft Agent Framework — canonical agent orchestrator per ADR-006
    # https://learn.microsoft.com/agent-framework/
    "agent-framework>=1.0.0",
    "agent-framework-azure-ai>=1.0.0",
]

# Integration tests run against a real Lab tenant. CI lane uses Workload
# Identity Federation per Sprint 41 item 41.3.3.
integration = [
    "apex-m[runtime,dev]",
    "pytest-integration>=0.2",
]
