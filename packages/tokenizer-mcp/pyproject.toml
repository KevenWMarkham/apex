[project]
name = "tokenizer-mcp"
version = "0.1.0"
description = "APEX tokenizer-mcp — scope-gated detokenisation + tokenise exposure for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "apex-tokenizer", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
tokenizer-mcp = "tokenizer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizer_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-tokenizer = { workspace = true }
mcp-common = { workspace = true }
