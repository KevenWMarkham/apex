[project]
name = "apex-purview"
version = "0.1.0"
description = "APEX Purview integration — classification registration, lineage capture, DLP policy emission, and trust-architecture glue for the Microsoft Purview platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_purview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Purview payload conformance tests",
]
