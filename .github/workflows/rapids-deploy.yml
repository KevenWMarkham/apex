# GSSC Lab Acceptance · runs when a pack release is tagged
name: RAPIDS GSSC Lab Deploy

on:
  push:
    tags:
      - 'pack-*-v*'
  workflow_dispatch:

jobs:
  lab-deploy:
    runs-on: ubuntu-latest
    environment: gssc-lab
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep deploy to GSSC Lab
        run: |
          az deployment group create \
            --resource-group rg-apex-m-lab \
            --template-file packs/${{ matrix.pack }}/iac/main.bicep \
            --parameters environment=lab
      - name: Helm rollout
        run: |
          helm upgrade --install apex-${{ matrix.pack }} \
            ./packs/${{ matrix.pack }}/helm \
            --values ./packs/${{ matrix.pack }}/helm/values-lab.yaml
      - name: Lab acceptance pack
        run: pytest packs/${{ matrix.pack }}/tests/lab/ -v
      - name: ConCon ARB submission
        run: python tools/submit-arb-conformance.py packs/${{ matrix.pack }}
