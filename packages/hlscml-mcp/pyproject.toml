[project]
name = "hlscml-mcp"
version = "0.1.0"
description = "APEX hlscml-mcp — HLS canonical reads (Patient / Observation / MedicationRequest). PHI-scoped."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core", "apex-hlscml", "fabric-mcp", "mcp-common", "pydantic>=2.9.0",
]

[project.scripts]
hlscml-mcp = "hlscml_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlscml_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-hlscml = { workspace = true }
fabric-mcp = { workspace = true }
mcp-common = { workspace = true }
