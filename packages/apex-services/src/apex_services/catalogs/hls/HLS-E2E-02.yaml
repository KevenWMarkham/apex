kind: service
service_code: HLS-E2E-02
version: 0.1.0
practice: hls
display_name: Clinical Decision Support
brief: "Guideline-adherent CDS with citation-chain output and per-recommendation physician review."
description: >
  Lead service for Provider sub-segment. Uses reasoning-tier model with curated evidence library.

personas:
  - { name: "Attending Physician", role: primary }
  - { name: "Chief Medical Officer", role: secondary }
  - { name: "Chief Quality Officer", role: secondary }

kpis:
