[project]
name = "mcp-common"
version = "0.1.0"
description = "APEX MCP shared scaffolding — tool-contract model, trace record, scope stubs, auth stubs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_common"]

[tool.uv.sources]
apex-core = { workspace = true }
