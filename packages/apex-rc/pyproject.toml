[project]
name = "apex-rc"
version = "0.1.0"
description = "APEX RC Practice bundle — binds SCML/MERML/CXML schemas, agents, services for Retail & Consumer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "apex-scml",
    "apex-merml",
    "apex-cxml",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_rc"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
apex-scml = { workspace = true }
apex-merml = { workspace = true }
apex-cxml = { workspace = true }
