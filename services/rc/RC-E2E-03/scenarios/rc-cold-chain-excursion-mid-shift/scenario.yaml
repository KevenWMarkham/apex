scenario_id: rc-cold-chain-excursion-mid-shift
title: Cold-chain excursion mid-shift
service_code: RC-E2E-03
domain: Pricing & Revenue
featured: true
moment: 'Dairy case at Big Box Store 100 exceeds temperature threshold for 47 minutes
  mid-shift. Operator must decide: sell-through, mark down, destroy. Currently 65%
  of shift goes to gathering info, 35% to deciding.'
solution: Real-time perishables-integrity agent fuses SKU-level elasticity with FSMA
  204 lot provenance. HITL gate on destroy / markdown actions above threshold.
use_case: Excursion triage + markdown decisioning, Wave 2 across NA footprint. Reads
  SCML.Lot , SCML.Inventory , MERML.Price , MERML.Markdown . Parent orchestration
  composes 5 agents.
service_productized: RC-E2E-03 Assortment &amp; Pricing + RC-E2E-09 Product Tracking.
  Commercial envelope per store tier. Wave 2 at 250-store pilot; Wave 3 enterprise.
personas: Primary Marisol Reyes · Store Operations Lead Approves markdown / destroy
  above threshold via Teams Adaptive Card; decision writes to audit row.
kpi: Manager time +5.2 hrs/shift · time-to-decision 12 min → 90 sec · shrink cost
  −18% · audit-row attributed · §16.13 reference deployment.
waves:
  w1_foundation: 'SOR: POS + Refrigeration Telemetry · Real-Time Hub · Bronze · Raw
    Landing · Tokenizer · Silver · Canonical'
  w2_pilot: 'Excursion Event Fires · DAG Orchestrator · Agent 1: Assess · Agent 2:
    Classify · Agent 3: Quantify'
  w3_scale_fuse: 'Enterprise Scale · Fuse: Dynamic Markdown · Fuse: Loyalty Churn
    · Purview Trust · Feedback Loop'
chain_24:
- step: 1
  key: w1-sor
  title: 'SOR: POS + Refrigeration Telemetry'
  layer: data
  kind: source
  purpose: Original system data lives here. Temperature readings stream from refrigeration
    controllers; SKU-level sales land from POS; lot-level receiving data lives in
    the ERP.
- step: 2
  key: w1-rth
  title: Real-Time Hub
  layer: integration
  kind: process
  purpose: Fabric's Real-Time Hub bridges SOR streams into Bronze Eventhouse with
    minimal transformation — event-time indexing, schema-on-read, dead-letter handling.
- step: 3
  key: w1-bronze
  title: Bronze · Raw Landing
  layer: data
  kind: store
  purpose: Bronze is the untransformed landing zone. Data lands in source-native shape
    — schema-on-read, WORM retention, Purview-classified at the point of ingest.
- step: 4
  key: w1-tokenizer
  title: Tokenizer
  layer: governance
  kind: process
  purpose: The Bronze→Silver boundary is where sensitive data is deterministically
    tokenized. Agents receive tokens only; cleartext detokenization happens only at
    user-surface time for authorized identities.
- step: 5
  key: w1-silver
  title: Silver · Canonical
  layer: schema
  kind: store
  purpose: Silver holds canonical, cleaned, typed, deduplicated, enriched, tokenized
    data. Every row carries the APEX canonical envelope (event_id, event_ts, entity_id,
    source_system, source_system_ts).
- step: 6
  key: w1-gold
  title: Gold · Agent-Safe Views
  layer: schema
  kind: store
  purpose: Gold materializes agent-consumable views with classification-aware masking,
    scoped to agent tenant/practice/persona. Direct Lake semantic models for sub-second
    queries.
- step: 7
  key: w1-mcp
  title: MCP Servers
  layer: integration
  kind: process
  purpose: MCP servers expose Gold views as typed, contract-validated tools for agents.
    Every tool carries input-schema, output-schema, SLO, classification-propagation
    rules, and trace instrumentation.
- step: 8
  key: w1-identity
  title: Entra · Managed Identity
  layer: identity
  kind: process
  purpose: Every APEX agent runs under a unique Entra managed-identity with a typed
    scope (tenant × practice × persona × classification × row filter). Visibility
    lattice enforces what the agent can see.
- step: 9
  key: w1-ledger
  title: LEDGER · Audit Row Store
  layer: governance
  kind: store
  purpose: LEDGER is the append-only decision-provenance store. Every agent decision
    writes a 14-field audit row with trace-id, three-version stamps, reasoning trace,
    HITL status, and downstream-effect cross-reference.
- step: 10
  key: w1-hitl-surface
  title: HITL Surface · Teams
  layer: experience
  kind: process
  purpose: HITL gates are first-class APEX primitives. ZERO_TOUCH / ACK_ONLY / HITL
    / ESCALATION kinds map deterministically from the classification of the decision.
- step: 11
  key: w2-event
  title: Excursion Event Fires
  layer: integration
  kind: trigger
  purpose: A Data Activator reflex rule watches Bronze Eventhouse for temperature
    excursions. When a refrigeration sensor exceeds threshold for >15 minutes, the
    event fires.
- step: 12
  key: w2-orchestrator
  title: DAG Orchestrator
  layer: agent
  kind: process
  purpose: 'The orchestrator composes 5 agents for the Cold-Chain Excursion response:
    (1) Assess, (2) Classify, (3) Quantify, (4) Decide, (5) Act. Manifest-governed,
    gate-placed.'
- step: 13
  key: w2-agent-assess
  title: 'Agent 1: Assess'
  layer: agent
  kind: agent
  purpose: The Assess agent reads the excursion event, pulls the full temperature
    time-series from Bronze Eventhouse, and characterizes severity (peak temp, duration,
    avg temp, door-open events).
- step: 14
  key: w2-agent-classify
  title: 'Agent 2: Classify'
  layer: agent
  kind: agent
  purpose: The Classify agent runs the FSMA 204 rule corpus against the assessment.
    Produces severity classification (MINOR / MAJOR / CRITICAL) and per-SKU disposition
    recommendation (sell-through, mark-down, destroy).
- step: 15
  key: w2-agent-quantify
  title: 'Agent 3: Quantify'
  layer: agent
  kind: agent
  purpose: The Quantify agent turns the classification into dollars. Retail value
    at full price · markdown value · shrink cost · projected sell-through within expiry
    window.
- step: 16
  key: w2-hitl
  title: HITL Gate
  layer: experience
  kind: gate
  purpose: 'The orchestrator pauses. An Adaptive Card fires to Marisol Reyes via Teams.
    Card shows: 412 units, 3 proposed actions, dollar impact, "Approve all / Modify
    / Reject".'
- step: 17
  key: w2-agent-act
  title: 'Agent 4: Act'
  layer: agent
  kind: agent
  purpose: 'The Act agent orchestrates three parallel downstream actions: (1) POS
    markdown upload, (2) Destroy ticket to refrigeration vendor, (3) Pull-team task
    in store-ops app.'
- step: 18
  key: w2-kpi
  title: KPI Attribution
  layer: outcome
  kind: outcome
  purpose: Every audit row carries outcome fields that roll up to KPI dashboards.
    KPI attribution back to the decision row (not just the aggregate) is APEX's signature.
- step: 19
  key: w3-scale
  title: Enterprise Scale
  layer: agent
  kind: process
  purpose: The same orchestration, the same agents, the same gates — rolled out across
    the full store network and every refrigerated fixture class.
- step: 20
  key: w3-fuse-markdown
  title: 'Fuse: Dynamic Markdown'
  layer: agent
  kind: fusion
  purpose: The cold-chain excursion agent no longer decides markdown depth in isolation.
    It calls the Dynamic Markdown agent which understands category-wide elasticity
    and aged-stock trajectory.
- step: 21
  key: w3-fuse-loyalty
  title: 'Fuse: Loyalty Churn'
  layer: agent
  kind: fusion
  purpose: The cold-chain event now checks customer signal. If high-LTV loyalty members
    purchased affected SKUs in the 48h pre-excursion, the loyalty-churn agent triggers
    proactive outreach.
- step: 22
  key: w3-purview
  title: Purview Trust
  layer: governance
  kind: process
  purpose: 'At enterprise scale, Purview becomes the single pane for auditors: full
    lineage from SOR → Bronze → Silver → Gold → MCP tool → Agent → Audit row → KPI.'
- step: 23
  key: w3-ledger-feedback
  title: Feedback Loop
  layer: outcome
  kind: outcome
  purpose: LEDGER's aggregated audit rows drive manifest evolution. Patterns in HITL
    overrides ("managers always reject destroy on SKU X") inform policy refinement.
    FSMA 204 rule updates propagate through manifest version bumps.
- step: 24
  key: w3-kpi-enterprise
  title: Enterprise KPI
  layer: outcome
  kind: outcome
  purpose: W2 pilot proved $1,313 per event and 90-second manager touch-time. W3 enterprise
    aggregates this across 2,400 stores, 4,400 fixture-classes, 85 events/week.
agents:
- role: assess
  label: Assess
  config: agents/assess/agent.yaml
- role: classify
  label: Classify
  config: agents/classify/agent.yaml
- role: quantify
  label: Quantify
  config: agents/quantify/agent.yaml
- role: decide
  label: Decide
  config: agents/decide/agent.yaml
- role: act
  label: Act
  config: agents/act/agent.yaml
- role: learn
  label: Learn
  config: agents/learn/agent.yaml
- role: pricing
  label: The Pricer
  config: agents/pricing/agent.yaml
