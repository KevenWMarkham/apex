[project]
name = "apex-g"
version = "0.1.0-stub"
description = "APEX-G — Google Cloud variant of APEX. Stub package; concrete implementations build out when commissioned. Sibling product to APEX-M (Microsoft) and APEX-A (AWS)."
requires-python = ">=3.12"
authors = [{ name = "Deloitte's Microsoft Technology & Services Practice" }]
license = "Proprietary"
dependencies = [
    "apex-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
