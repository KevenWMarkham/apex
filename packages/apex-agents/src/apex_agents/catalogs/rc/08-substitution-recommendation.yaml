kind: agent
name: apex.rc.agents.substitution-recommendation
version: 0.1.0
practice: rc
persona: Store Associate
service_codes: [RC-E2E-03]
model_tier: lightweight
model_pin: gpt-4o-mini-2024-07-18
prompt_sha: ""
description: >
  Real-time stockout substitution recommendation. Uses adjacency,
  shopper personalization, and margin-impact signals to recommend
  alternates at the shelf.
