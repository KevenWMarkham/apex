[project]
name = "apex"
version = "0.1.0"
description = "APEX — Agent-based Platform for EXecution. Deloitte's delivery accelerator for agentic AI on Microsoft."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Deloitte APEX Team" }]
license = { text = "Proprietary — Deloitte Internal" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

# --- Internal package index ---
# When the Deloitte-internal Artifactory / proxy URL is known, uncomment and
# set the URL below. uv will resolve from the internal index first, falling
# back to PyPI for any dependency not mirrored internally.
#
# [[tool.uv.index]]
# name = "deloitte-internal"
# url = "https://<internal-artifactory-host>/api/pypi/pypi-virtual/simple/"
# default = true
# explicit = false

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "conformance: marks tests verifying industry-standard conformance (round-trips, registry audits, format translators). Run with 'pytest -m conformance'.",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
