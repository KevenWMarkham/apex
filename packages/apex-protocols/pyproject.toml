[project]
name = "apex-protocols"
version = "0.1.0"
description = "APEX OT protocol adapters — Sprint 25. OPC UA, IEC 61850, SAE J1939 transport wrappers used inside Sprint 15 SOR adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "pydantic>=2.9.0",
    "typer>=0.13.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_protocols"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Protocol adapter conformance tests",
]
