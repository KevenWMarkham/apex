[project]
name = "apex-standards-sid"
version = "0.1.0"
description = "APEX TM Forum SID Pattern-B mirror — information-model subset consumed by TMT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. TM Forum SID is openly published; structural mirrors only." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_sid"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
