[project]
name = "pharma-recall-mcp"
version = "0.1.0"
description = "APEX pharma-recall-mcp — pharmaceutical recall aggregators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "apex-schemas-common", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
pharma-recall-mcp = "pharma_recall_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_recall_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
mcp-common = { workspace = true }
