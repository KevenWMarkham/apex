[project]
name = "apex-standards-j1939"
version = "0.1.0"
description = "APEX SAE J1939 binding — SPN / PGN registry + CAN frame shape (shared by AXLE, ICE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. J1939 content is SAE-copyrighted; this package ships binding layer only." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_j1939"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
