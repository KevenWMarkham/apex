[project]
name = "apex-adapters"
version = "0.1.0"
description = "APEX SOR integration adapter framework + 15 reference adapters across HLS / ERP / CRM / Supply / OT-Historian / Legacy. Sprint 15."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "apex-core>=0.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: SOR adapter conformance tests",
]
