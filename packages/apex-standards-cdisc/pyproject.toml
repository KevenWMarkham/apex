[project]
name = "apex-standards-cdisc"
version = "0.1.0"
description = "APEX CDISC ODM + SDTM Pattern-B mirror — clinical-trial data subset consumed by HLS StudyML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal. CDISC standards are openly published." }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_standards_cdisc"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
