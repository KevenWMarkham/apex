[project]
name = "apex-telml"
version = "0.1.0"
description = "APEX TELML — Tech/Media/Telecom canonical entities over TM Forum SID."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "apex-standards-sid",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_telml"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
apex-standards-sid = { workspace = true }
