[project]
name = "apex-medallion"
version = "0.1.0"
description = "APEX medallion helpers — Bronze landing config, retention policy, dead-letter schema, partitioning strategies. Imported by Fabric PySpark notebooks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "apex-tokenizer",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_medallion"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
apex-tokenizer = { workspace = true }
