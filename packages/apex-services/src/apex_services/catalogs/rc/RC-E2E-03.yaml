kind: service
service_code: RC-E2E-03
version: 0.1.0
practice: rc
display_name: Assortment & Pricing Intelligence
brief: "Category-level margin-exposure detection, elasticity modelling, markdown-cadence recommendation."
description: >
  Lead Wave-2 service for the Chief Merchant. Combines reasoning-tier elasticity modelling with HITL gate on markdown decisions above threshold.

personas:
  - { name: "Chief Merchant", role: primary }
  - { name: "VP Category Management", role: secondary }
  - { name: "VP Pricing", role: secondary }

kpis:
  - name: "GM (managed categories)"
    direction: up
    baseline: "31.8%"
    wave2_target: "+80-180 bps"
    wave3_target: "+250-400 bps"
  - name: "markdown rate"
    direction: down
    baseline: "typical"
    wave2_target: "-200 to -400 bps"

slos:
  - { name: "recommendation latency", target: "p95 < 5s", enforcement: soft }
  - { name: "audit-row emission", target: "100% of decisions", enforcement: hard }

waves:
  - wave: wave_1
    duration: "4-12 weeks"
    fee_band_low_usd: 300000
    fee_band_high_usd: 1200000
    deliverables:
      - "target architecture"
      - "service design"
      - "Wave-2 roadmap"
  - wave: wave_2
    duration: "6-12 months"
    fee_band_low_usd: 4000000
    fee_band_high_usd: 15000000
    deliverables:
      - "production agent fleet"
      - "KPI measurement"
      - "operating model"
  - wave: wave_3
    duration: "multi-year"
    fee_band_low_usd: 8000000
    fee_band_high_usd: 30000000
    deliverables:
      - "expansion"
      - "managed services"

commercial_model: hybrid
value_share_eligible: true

linked_agents:
  - apex.rc.agents.assortment-pricing
  - apex.rc.agents.markdown-cadence
  - apex.rc.agents.promotion-effectiveness

linked_archetypes:
  - F1-continuous-monitor-hitl-alert
  - F3-predictive-trigger-workflow-aware

schemas_touched: [MERML, SCML]
standards: ['GS1', 'Schema.org']
primary_contact: rc-practice-lead@deloitte.com
