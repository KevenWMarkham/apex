[project]
name = "apex-hlscml"
version = "0.1.0"
description = "APEX HLSCML — Healthcare & Life Sciences canonical entities (Patient, Encounter, Observation, Claim, Study, AdverseEvent, ...). Pattern C over FHIR R4 + CDISC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "apex-standards-fhir",
    "apex-standards-cdisc",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_hlscml"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
apex-standards-fhir = { workspace = true }
apex-standards-cdisc = { workspace = true }
