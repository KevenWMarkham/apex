[project]
name = "apex-core"
version = "0.1.0"
description = "APEX L1 Contract — manifest schemas, validators, canonical envelope, SemVer bump classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
]

[project.scripts]
apex = "apex_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_core"]
