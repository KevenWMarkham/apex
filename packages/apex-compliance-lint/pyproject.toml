[project]
name = "apex-compliance-lint"
version = "0.1.0"
description = "APEX compliance linter — Sprint 29 Task 29.9. Independence-language rules + configurable rule packs + multi-format file adapters (HTML, DOCX, MD, PPTX). Standalone reusable beyond the Deloitte-Microsoft baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
authors = [{ name = "Deloitte DMTSP — Consumer Industry" }]
dependencies = [
    "pydantic>=2.9.0",
    "typer>=0.13.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=1.0"]

[project.scripts]
apex-compliance-lint = "apex_compliance_lint._cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_compliance_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "conformance: Sprint 29 conformance tests",
]
