[project]
name = "apex-scml"
version = "0.1.0"
description = "APEX SCML — Supply Chain Markup Language canonical entities (RC Practice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "apex-schemas-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_scml"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-schemas-common = { workspace = true }
