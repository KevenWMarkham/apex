[project]
name = "apex-tokenizer"
version = "0.1.0"
description = "APEX tokeniser — deterministic + reversible + vault-backed tokens for PII / PHI / PCI / trade-secret / member-only fields."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = [
    "apex-core",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_tokenizer"]

[tool.uv.sources]
apex-core = { workspace = true }
