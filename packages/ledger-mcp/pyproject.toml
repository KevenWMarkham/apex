[project]
name = "ledger-mcp"
version = "0.1.0"
description = "APEX ledger-mcp — audit-row persistence + trace-id lookup + signature verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Internal" }
dependencies = ["apex-core", "apex-audit", "mcp-common", "pydantic>=2.9.0"]

[project.scripts]
ledger-mcp = "ledger_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_mcp"]

[tool.uv.sources]
apex-core = { workspace = true }
apex-audit = { workspace = true }
mcp-common = { workspace = true }
